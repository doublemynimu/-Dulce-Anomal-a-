const BKP=[`<h2>🌙 Cuaderno de MoonFlower</h2><p>Pastelera de Puerto Nimbus.<br>Dueña, hasta anoche, de <em>Café MoonFlower</em>.</p><p>Si estás leyendo esto, la tienda ya es tuya. Perdóname por no despedirme: la noche se puso rara y tuve que irme rápido.</p><small>— M.</small>`,
`<h2>La tienda</h2><p>Abrimos cuando cae la noche. El <em>ventanal</em> del mostrador (a tu izquierda, junto a la puerta de la casa) es el negocio entero: ábrelo con <em>E</em> y los clientes empiezan a llegar. Ciérralo cuando ya nadie espere, o duérmete en la cama de la casa y deja que pase el turno.</p><p>Mover: WASD. Mirar: el ratón. Interactuar: E o clic.</p>`,
`<h2>El mostrador</h2><p>Cada cliente se planta frente a ti y dice su pedido en voz alta. No lo cocines todavía: acércate a la <em>caja registradora</em> (la rosa, a tu derecha) y acéptalo con E. Entonces su recibo aparece en el tablero de pedidos de la pared izquierda, sobre la biblioteca.</p><p>Las recetas cuelgan en dos tableros: el grande, en la pared derecha del local, y el estrecho, colgado en la cocina entre las dos islas.</p>`,
`<h2>La cocina</h2><p>Al fondo está la <em>alacena</em>: harina, huevos, leche, mantequilla, azúcar, levadura. Casi toda masa pide <em>tres</em> de esas cosas; la receta te dice cuáles. Échalas al bol (Mezcla) y sigue el orden de los pasos: horno, plancha, freidora, batidora...</p><p>Cuando el postre queda listo no vuela solo: <em>llévalo en la mano</em> hasta la bandeja y entrégalo. Un error y se va la propina.</p>`,
`<h2>Lo que no se dice</h2><p>No todos los clientes son clientes. Yo las llamo <em>Famélicas</em>. Hablan como gente, piden como gente... pero la cámara del mostrador (tecla <em>C</em>) enseña su verdadera forma: ojos de más, dientes de más, un cascarón vacío, dos cabezas, brazos de sobra, una sonrisa enorme, tentáculos, una sombra que no es suya, o la cara en blanco.</p><p>Algunas se notan a simple vista. Otras solo hablan raro: háblales con <em>Q</em> y escucha si repiten lo que dijo el cliente de antes.</p>`,
`<h2>Qué hacer con ellas</h2><p>Nunca les sirvas: se alimentan. La pistola está en el cajón bajo el mostrador (<em>F</em> o clic). Dejan un cuerpo; recógelo con E y llévalo a la <em>Procesadora</em> del fondo. De ahí salen ingredientes nuevos, pero es lenta y caprichosa: pide varios cuerpos por ingrediente y, a veces, descanso.</p><p>Ojo: un disparo a un cliente normal no se perdona. Mira bien antes.</p>`,
`<h2>La corrupción</h2><p>Cada Famélica deja una marca en el aire. En la esquina de tu vista late un <em>corazón rosa</em>: mientras más rareza hay en la tienda, más se vacía. Si se apaga del todo... no lo sé. No quise averiguarlo.</p><p>En la casa (la puerta rosa junto al mostrador) guardo el <em>postre de la abuela</em>: lo repone, pero tarda en volver a hornearse. Come con cabeza.</p>`,
`<h2>Últimos consejos</h2><p>• Algunos clientes dejan propina si todo sale perfecto.<br>• En la computadora hay tienda, mejoras, recetario y mis correos viejos.<br>• Cambia de clase cuando quieras; cada una tiene su estilo.<br>• Si algo te mira sin parpadear, dispara... si estás segura.</p><p>Suerte, pastelero.</p><small>— M.</small>`];
